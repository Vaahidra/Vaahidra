# Active GitHub Pages sur cette branche (dossier /docs) sans passer par les réglages du dépôt.
# Le site est ensuite servi à l'adresse https://vaahidra.github.io/Vaahidra/
name: Activer GitHub Pages

on:
  push:
    branches: [claude/fiancailles-invitation-virtuelle-3hm0fs]
  workflow_dispatch:

permissions:
  pages: write
  contents: read

jobs:
  activer:
    runs-on: ubuntu-latest
    steps:
      - name: Créer ou mettre à jour le site Pages (source = cette branche, dossier /docs)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCHE: ${{ github.ref_name }}
        run: |
          cat > body.json <<JSON
          {"build_type":"legacy","source":{"branch":"$BRANCHE","path":"/docs"}}
          JSON
          set +e
          gh api -X POST "repos/$REPO/pages" --input body.json > out.json 2> err.txt
          code=$?
          set -e
          if [ $code -eq 0 ]; then
            echo "Site Pages créé :"; cat out.json
          elif grep -q "already exists\|409" err.txt out.json; then
            echo "Site Pages déjà présent, mise à jour de la source…"
            gh api -X PUT "repos/$REPO/pages" --input body.json
          else
            echo "Échec de l'activation automatique :"; cat err.txt out.json
            exit 1
          fi
      - name: Demander une construction du site
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: gh api -X POST "repos/$REPO/pages/builds" || true
      - name: Adresse du site
        run: echo "https://vaahidra.github.io/Vaahidra/"
